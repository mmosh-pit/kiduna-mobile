<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kiduna_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kiduna_mobile</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Phantom signing bridge.

    Phantom's signTransaction expects a web3.js Transaction object, not the
    base64 string the backend returns. Modelling Solana's wire format in Dart
    to satisfy that would be a lot of code for no benefit, so the conversion
    happens here where web3.js already exists.

    Loaded before flutter_bootstrap.js so window.kidunaSignTransaction is
    defined by the time the app can call it.
  -->
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <script>
    /**
     * Sign a base64 transaction with Phantom and return it re-encoded.
     *
     * The transaction arrives already signed by the admin wallet, so it is
     * deserialized without signature verification — it is legitimately
     * incomplete until Phantom adds the fee payer's signature.
     *
     * Throws if Phantom is missing or the user rejects the prompt.
     */
    window.kidunaSignTransaction = async function (txBase64) {
      if (!window.solana || !window.solana.isPhantom) {
        throw new Error('Phantom wallet not found');
      }
      if (!window.solanaWeb3) {
        throw new Error('solana web3 library not loaded');
      }

      const raw = Uint8Array.from(atob(txBase64), function (c) {
        return c.charCodeAt(0);
      });

      const tx = window.solanaWeb3.Transaction.from(raw);

      // Phantom prompts the user here, and rejects if they decline.
      const signed = await window.solana.signTransaction(tx);

      // Still partially signed from web3.js's perspective until broadcast,
      // so skip its verification on the way back out.
      const out = signed.serialize({
        requireAllSignatures: false,
        verifySignatures: false,
      });

      let binary = '';
      const bytes = new Uint8Array(out);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
