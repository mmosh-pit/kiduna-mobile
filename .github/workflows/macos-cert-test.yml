name: Test macOS Cert & Signing

on:
  workflow_dispatch:
  push:
    branches:
      - test-cert
      - feat/build-application-gitactions

jobs:
  macos-signing-test:
    runs-on: macos-latest
    environment: dev

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        shell: bash
        run: |
          cat > .env <<EOF
          ENV=${{ vars.APP_ENV || 'dev' }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          AUTH_API_URL=${{ secrets.AUTH_API_URL }}
          STUDIO_BASE_URL=${{ secrets.STUDIO_BASE_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY=${{secrets.GOOGLE_API_KEY}}
          EOF

      - run: flutter pub get

      - name: Build macOS
        run: |
          flutter build macos --release \
            --obfuscate \
            --split-debug-info=build/macos/debug-info

      - name: Debug — verify .p12 and password
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          echo "=== File info ==="
          ls -la cert.p12
          file cert.p12
          echo ""
          echo "=== Base64 length ==="
          echo "Length: $(echo -n "$CERT_P12" | wc -c) chars"
          echo ""
          echo "=== Password check ==="
          echo "Password length: ${#CERT_PASSWORD}"
          echo "First char: ${CERT_PASSWORD:0:1}***"
          echo ""
          echo "=== .p12 encryption format ==="
          openssl pkcs12 -in cert.p12 -info -passin pass:"$CERT_PASSWORD" -nokeys -noout 2>&1 | head -10 || true
          echo ""
          echo "=== OpenSSL password verification ==="
          if openssl pkcs12 -in cert.p12 -noout -passin pass:"$CERT_PASSWORD" 2>&1; then
            echo "✅ OpenSSL: .p12 password is CORRECT"
          else
            echo "❌ OpenSSL: .p12 password is WRONG"
            exit 1
          fi
          rm cert.p12

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: temp-ci-keychain-pwd
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import cert.p12 \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "=== Keychain contents ==="
          security find-identity -v -p codesigning build.keychain
          rm cert.p12

      - name: Sign macOS app
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="build/macos/Build/Products/Release/kiduna_mobile.app"
          codesign --deep --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" \
            --entitlements macos/Runner/Release.entitlements \
            "$APP"
          echo "=== Verify signature ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | head -20

      - name: Notarize macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/macos/Build/Products/Release/kiduna_mobile.app"
          ditto -c -k --keepParent "$APP" app-for-notarization.zip
          echo "=== Submit for notarization ==="
          xcrun notarytool submit app-for-notarization.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          echo ""
          echo "=== Staple ticket ==="
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          rm app-for-notarization.zip

      - name: Package signed macOS bundle
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" \
            "$GITHUB_WORKSPACE/macos-signed-test.zip"

      - name: Upload signed macOS bundle
        uses: actions/upload-artifact@v5
        with:
          name: macos-signed-test
          path: macos-signed-test.zip
