name: Flutter Multi Platform Build

on:
  push:
    branches:
      - feat/build-application-gitactions
      - feat/feature-build-worflow
      - dev
  workflow_dispatch:

jobs:
  linux-android-web:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        shell: bash
        run: |
          cat > .env <<EOF
          ENV=${{ vars.APP_ENV || 'dev' }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          AUTH_API_URL=${{ secrets.AUTH_API_URL }}
          STUDIO_BASE_URL=${{ secrets.STUDIO_BASE_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY=${{secrets.GOOGLE_API_KEY}}
          EOF

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - run: flutter pub get

      - run: flutter doctor -v

      # - name: Build APK
      #   run: flutter build apk --release

      # - name: Build AAB
      #   run: flutter build appbundle --release

      - name: Build Linux
        run: flutter build linux --release

      - name: Build Web
        run: flutter build web --release

      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/linux-bundle.zip" .

      - name: Package Web bundle
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/web-bundle.zip" .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: linux-bundle.zip

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web-bundle.zip

  windows:
    runs-on: windows-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        shell: bash
        run: |
          cat > .env <<EOF
          ENV=${{ vars.APP_ENV || 'dev' }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          AUTH_API_URL=${{ secrets.AUTH_API_URL }}
          STUDIO_BASE_URL=${{ secrets.STUDIO_BASE_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY=${{secrets.GOOGLE_API_KEY}}
          EOF

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $iss = @'
          #define AppName "Kiduna"
          #define AppExe "kiduna_mobile.exe"
          #define AppVersion "1.0.${{ github.run_number }}"

          [Setup]
          AppId={{B2F1B7A0-8A2A-4D4E-9B4C-KIDUNA00001}}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher=Kinship
          DefaultDirName={autopf}\{#AppName}
          DefaultGroupName={#AppName}
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=kiduna-windows-setup
          Compression=lzma2/max
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          WizardStyle=modern
          UninstallDisplayIcon={app}\{#AppExe}

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{group}\{#AppName}"; Filename: "{app}\{#AppExe}"
          Name: "{group}\Uninstall {#AppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#AppName}"; Filename: "{app}\{#AppExe}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Run]
          Filename: "{app}\{#AppExe}"; Description: "Launch {#AppName}"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path installer.iss -Value $iss -Encoding ASCII

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: kiduna-windows-setup.exe

  macos:
    runs-on: macos-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        shell: bash
        run: |
          cat > .env <<EOF
          ENV=${{ vars.APP_ENV || 'dev' }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          AUTH_API_URL=${{ secrets.AUTH_API_URL }}
          STUDIO_BASE_URL=${{ secrets.STUDIO_BASE_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY=${{secrets.GOOGLE_API_KEY}}
          EOF

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package macOS bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/macos-bundle.zip" .

      - name: Package iOS bundle
        run: |
          cd build/ios/iphoneos
          zip -r "$GITHUB_WORKSPACE/ios-bundle.zip" .

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos-bundle.zip

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios-bundle.zip

  release:
    needs: [linux-android-web, windows, macos]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp artifacts/android-apk/app-release.apk release-assets/app-release.apk
          cp artifacts/android-aab/app-release.aab release-assets/app-release.aab
          cp artifacts/linux/linux-bundle.zip release-assets/linux-bundle.zip
          cp artifacts/web/web-bundle.zip release-assets/web-bundle.zip
          cp artifacts/windows/kiduna-windows-setup.exe release-assets/kiduna-windows-setup.exe
          cp artifacts/macos/macos-bundle.zip release-assets/macos-bundle.zip
          cp artifacts/ios-build/ios-bundle.zip release-assets/ios-bundle.zip
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated multi-platform build from `${{ github.ref_name }}` @ `${{ github.sha }}`.
          files: release-assets/*
