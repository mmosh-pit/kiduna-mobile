# Static analysis configuration.
#
# Enforces the coding standards described in CLAUDE.md. Run with:
#   flutter analyze --fatal-infos --fatal-warnings
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error                       # print() becomes a build failure
    use_build_context_synchronously: error   # missing mounted check = failure
    unused_import: error
    missing_required_param: error
    todo: ignore
    # Generated code is excluded from analysis but keep annotations lenient.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

linter:
  rules:
    # Style — matches CLAUDE.md Section 3.
    - prefer_single_quotes
    - require_trailing_commas
    - prefer_relative_imports
    - directives_ordering
    - always_declare_return_types
    - unnecessary_lambdas
    # Const & immutability.
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_final_fields
    # Safety.
    - avoid_print
    - unawaited_futures
    - use_key_in_widget_constructors
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    # Widget hygiene.
    - sort_child_properties_last
    - avoid_redundant_argument_values
    - use_build_context_synchronously
