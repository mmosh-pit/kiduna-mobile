name: kiduna_mobile
description: 'Kiduna — Deep. Warm. Alive.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/

  fonts:
    - family: Avenir
      fonts:
        - asset: assets/fonts/avenir-book.ttf
          weight: 400
        - asset: assets/fonts/avenir-heavy.ttf
          weight: 700
    - family: GoudyHeavyface
      fonts:
        - asset: assets/fonts/goudy-heavyface.ttf
