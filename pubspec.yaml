name: kiduna
description: 'Kiduna — Deep. Warm. Alive.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.3.2
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  medieval_poker_engine:
    path: packages/medieval_poker_engine
  flame: ^1.34.0
  flame_camera_tools: ^5.0.2
  web_socket_channel: 3.0.3
  audioplayers: ^6.8.1
  uuid: 4.5.1
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
    - assets/images/allies/
    - assets/images/organization-crests/
    - assets/images/realm-emblems/
    - assets/fixtures/
    - assets/medieval_poker/
    - assets/medieval_poker/cards/
    - assets/medieval_poker/power/
    - assets/medieval_poker/items/
    - assets/medieval_poker/reference/

  fonts:
    - family: Avenir
      fonts:
        - asset: assets/fonts/avenir-book.ttf
          weight: 400
        - asset: assets/fonts/avenir-heavy.ttf
          weight: 700
    - family: GoudyHeavyface
      fonts:
        - asset: assets/fonts/goudy-heavyface.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
